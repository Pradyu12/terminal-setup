monitor=,auto,auto,1

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(4fb3a8ff) rgba(e8b54bff) 45deg
    col.inactive_border = rgba(3a3a3a55)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 3
        noise = 0.02
        contrast = 1.0
        brightness = 0.9
        vibrancy = 0.2
        vibrancy_darkness = 0.5
        new_optimizations = true
        xray = false
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1a55)
    }
    dim_inactive = true
    dim_strength = 0.15
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    bezier = easeOut, 0.0, 0.0, 0.2, 1.0
    bezier = easeInOut, 0.4, 0, 0.2, 1
    animation = windows, 1, 4, easeOut, slide
    animation = windowsIn, 1, 3, easeOut, slide
    animation = windowsOut, 1, 3, easeIn, slide
    animation = fade, 1, 3, easeOut
    animation = workspaces, 1, 4, easeOut, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

gestures {
    workspace_swipe = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

$mod = SUPER

bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, V, togglefloating
bind = $mod, D, exec, wofi --show drun
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, F, fullscreen, 0
bind = $mod, N, exec, kitty -e bash ~/.local/bin/black-pearl-ws

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

windowrulev2 = float, class:^(wofi)$
windowrulev2 = blur, class:^(kitty)$
windowrulev2 = opaque, class:^(btop)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-applet)$

exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = kitty
