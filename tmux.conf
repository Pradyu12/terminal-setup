# ═══════════════════════════════════════════════════════════════════════════════
# BLACK PEARL TMUX CONFIG
# ═══════════════════════════════════════════════════════════════════════════════

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Index from 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows
set -g renumber-windows on

# Mouse
set -g mouse on

# History
set -g history-limit 100000

# Faster escape
set -sg escape-time 0

# Focus events
set -g focus-events on

# Graphics passthrough (kitty + icat animated GIF)
set -g allow-passthrough on
set -ga terminal-features ",xterm-kitty:passthrough"

# Terminal colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ═══════════════════════════════════════════════════════════════════════════════
# BLACK PEARL PALETTE
# ═══════════════════════════════════════════════════════════════════════════════
# bg:           #0b0e1a
# fg:           #dbe2e8
# gold:         #e8b54b
# bright-gold:  #ffd166
# amber:        #f0a04b
# sea-teal:     #4fb3a8
# wood:         #8b5a2b
# crimson:      #a8242f
# bone:         #e6e0d0
# dim:          #4a5263
# ═══════════════════════════════════════════════════════════════════════════════

# Status bar
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0b0e1a,fg=#dbe2e8"

# Left status: session name
set -g status-left-length 40
set -g status-left "#[bg=#e8b54b,fg=#0b0e1a,bold]  #S  #[bg=#0b0e1a,fg=#e8b54b]"

# Right status: system graphs + time
set -g status-right-length 120
set -g status-right "#[fg=#ffd166]#(bash ~/.config/tmux/status.sh)  #[fg=#4fb3a8]%H:%M #[fg=#e8b54b]%d %b #[bg=#e8b54b,fg=#0b0e1a,bold] #h "

# Window status
setw -g window-status-format " #[fg=#4a5263]#I #[fg=#dbe2e8]#W "
setw -g window-status-current-format "#[bg=#4fb3a8,fg=#0b0e1a,bold] #I #[bg=#ffd166,fg=#0b0e1a,bold] #W "
setw -g window-status-separator ""
setw -g window-status-style "fg=#4a5263"
setw -g window-status-current-style "fg=#ffd166"

# Pane borders
set -g pane-border-style "fg=#3a4152"
set -g pane-active-border-style "fg=#e8b54b"

# Message/command style
set -g message-style "bg=#a8242f,fg=#dbe2e8"
set -g message-command-style "bg=#e8b54b,fg=#0b0e1a"

# Mode style
set -g mode-style "bg=#4a5263,fg=#dbe2e8"

# Clock
setw -g clock-mode-colour "#ffd166"

# ═══════════════════════════════════════════════════════════════════════════════
# KEYBINDINGS
# ═══════════════════════════════════════════════════════════════════════════════

# Split panes (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# New window
bind c new-window -c "#{pane_current_path}"

# Kill pane/window
bind x kill-pane
bind X kill-window

# Copy mode (vim-like)
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle